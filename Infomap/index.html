<style>
:root {
    --gold: #e0b25a;
    --gold-dim: rgba(224,178,90,0.55);
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #10120e;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }

/* ---------- 顶部标题条 ---------- */
.header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    padding: 8px 12px 6px;
    background: linear-gradient(180deg, rgba(10,12,8,0.92), rgba(10,12,8,0));
    text-align: center;
    pointer-events: none;
}

.header h1 {
    margin: 0;
    color: var(--gold);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
}

.header .sub {
    margin-top: 2px;
    color: rgba(255,255,255,0.65);
    font-size: 10px;
}

/* ---------- 日期跳转条 ---------- */
.daybar {
    position: fixed;
    top: 40px;
    left: 0;
    right: 0;
    z-index: 20;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 4px 10px 6px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
}
.daybar::-webkit-scrollbar { display: none; }

.daybar button {
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--gold-dim);
    background: rgba(0,0,0,0.35);
    color: rgba(255,255,255,0.75);
    font-size: 11px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
}

.daybar button.active {
    background: var(--gold);
    color: #241a04;
    border-color: var(--gold);
    box-shadow: 0 0 8px rgba(224,178,90,0.6);
}

/* ---------- 滑动容器 ---------- */
.slider {
    width: 100%;
    height: 100%;
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
}
.slider::-webkit-scrollbar { display: none; }
.slider { scrollbar-width: none; }

.slide {
    position: relative;
    min-width: 100%;
    height: 100%;
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 84px 18px 74px;
    color: #f3ead9;
}

/* ---------- 首页：路线图 ---------- */
.slide.home-slide {
    padding: 0;
    justify-content: center;
    align-items: center;
    background: #0b0d09;
}

.slide.home-slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.home-hint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 34px;
    z-index: 2;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.8);
    text-shadow: 0 1px 4px rgba(0,0,0,0.85);
    pointer-events: none;
}

/* 每天不同的主题渐变 */
.slide.region-flight    { background: linear-gradient(160deg, #1a2140, #0f1428 60%, #10120e); }
.slide.region-nairobi   { background: linear-gradient(160deg, #2b3a4a, #16202b 60%, #10120e); }
.slide.region-samburu   { background: linear-gradient(160deg, #7a4a24, #4a2c12 60%, #10120e); }
.slide.region-nakuru    { background: linear-gradient(160deg, #1f4a4d, #163333 60%, #10120e); }
.slide.region-village   { background: linear-gradient(160deg, #6b3220, #3d1c12 60%, #10120e); }
.slide.region-mara      { background: linear-gradient(160deg, #6b4a1e, #472f11 60%, #10120e); }
.slide.region-serengeti { background: linear-gradient(160deg, #7a3620, #4a1f10 60%, #10120e); }
.slide.region-arusha    { background: linear-gradient(160deg, #3a4a3a, #202b20 60%, #10120e); }
.slide.region-amboseli  { background: linear-gradient(160deg, #8a4a1e, #522d10 60%, #10120e); }
.slide.region-depart    { background: linear-gradient(160deg, #34404a, #1c242b 60%, #10120e); }

.slide-inner {
    overflow-y: auto;
    max-height: 100%;
    padding-right: 2px;
}

.day-tag {
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 6px;
}

.day-tag .num {
    font-size: 34px;
    font-weight: 800;
    color: var(--gold);
    line-height: 1;
}

.day-tag .date {
    font-size: 13px;
    color: rgba(255,255,255,0.8);
    font-weight: 600;
}

.title {

    font-weight: 700;

}

.badges {

.badge {
    font-size: 10.5px;

    border-radius: 10px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    white-space: nowrap;
}

.badge.star {

.desc {

    margin-bottom: 12px;

.info-card {

    padding: 10px 12px;

.info-row {
    display: flex;

}

.info-row .label {

    color: var(--gold);

}

.info-row .value {
    color: rgba(255,255,255,0.88);
}

.info-row.note .value {
    color: rgba(255,255,255,0.6);
    font-style: italic;
    font-size: 11px;
}

/* ---------- 航班卡片（Day0 / 返程） ---------- */
.flight-leg {
    background: rgba(0,0,0,0.32);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
}

.flight-leg .flight-date {
    font-size: 11px;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 8px;
}

.flight-route {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.flight-route .ap {
    flex: 1;
    min-width: 0;
}

.flight-route .ap.arr { text-align: right; }

.flight-route .code {
    font-size: 20px;
    font-weight: 800;
    color: #fff;
}

.flight-route .city {
    font-size: 11px;
    color: rgba(255,255,255,0.7);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.flight-route .time {
    font-size: 13px;
    color: var(--gold);
    font-weight: 700;
    margin-top: 2px;
}

.flight-route .plane {
    flex: 0 0 auto;
    color: rgba(255,255,255,0.4);
    font-size: 15px;
    padding: 0 4px;
}

.flight-route .arrnote {
    font-size: 9.5px;
    color: rgba(255,255,255,0.55);
    margin-top: 2px;
}

.flight-meta {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed rgba(255,255,255,0.15);
    font-size: 11px;
    color: rgba(255,255,255,0.75);
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;

/* ---------- 左右箭头（桌面点击用） ---------- */
.arrow {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    z-index: 15;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(0,0,0,0.35);

.arrow.left { left: 6px; }
.arrow.right { right: 6px; }

/* ---------- 页码圆点 ---------- */
.dots {

    right: 0;

.dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
}

.dot.active {
    background: var(--gold);
    box-shadow: 0 0 4px var(--gold);
}
</style>
</head>

const weekdayNames = ["周日","周一","周二","周三","周四","周五","周六"];

function fmtDate(base, offset) {
    const d = new Date(base + "T00:00:00");
    d.setDate(d.getDate() + offset);
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const dd = String(d.getDate()).padStart(2,"0");
    return { label: mm + "-" + dd, weekday: weekdayNames[d.getDay()] };
}

        '<div class="flight-leg">' +
            '<div class="flight-date">' + leg.date + '</div>' +
            '<div class="flight-route">' +
                '<div class="ap dep">' +
                    '<div class="code">' + leg.dep.code + '</div>' +
                    '<div class="city">' + leg.dep.city + '</div>' +
                    '<div class="time">' + leg.dep.time + '</div>' +
                '</div>' +
                '<div class="plane">&#9992;</div>' +
                '<div class="ap arr">' +
                    '<div class="code">' + leg.arr.code + '</div>' +
                    '<div class="city">' + leg.arr.city + '</div>' +
                    '<div class="time">' + leg.arr.time + '</div>' +
                    arrNote +
                '</div>' +
            '</div>' +
            '<div class="flight-meta">' +
                '<span><b>' + leg.flightNo + '</b></span>' +
                '<span>' + leg.operator + '</span>' +
                '<span>Class: (' + leg.cls + ')</span>' +
                '<span>' + leg.meals + '</span>' +
            '</div>' +
        '</div>'
    );
}

const slider = document.getElementById("slider");
const dotsEl = document.getElementById("dots");
const daybarEl = document.getElementById("daybar");
const sub = document.getElementById("subHeader");

const numberedDays = days.filter(day => day.type !== "home");
const firstDate = fmtDate(startDate, 0);
const lastDate = fmtDate(startDate, numberedDays.length - 1);
sub.textContent = firstDate.label + " ~ " + lastDate.label + " · 共" + numberedDays.length + "天";

let dateOffset = 0;

days.forEach((day, i) => {
    // slide
    const slide = document.createElement("div");

    if (day.type === "home") {
        slide.className = "slide home-slide";
        slide.id = "home";
        slide.innerHTML =
            '<img src="' + day.image + '" alt="行程路线图">' +
            '<div class="home-hint">' + day.hint + '</div>';
        slider.appendChild(slide);

        const dot = document.createElement("div");
        dot.className = "dot active";
        dotsEl.appendChild(dot);

        const btn = document.createElement("button");
        btn.textContent = "\u{1F3E0}";
        btn.className = "active";
        btn.addEventListener("click", () => {
            slide.scrollIntoView({ behavior: "smooth", inline: "start" });
        });
        daybarEl.appendChild(btn);
        return;
    }

    const d = fmtDate(startDate, dateOffset);
    dateOffset++;

    slide.className = "slide region-" + day.region;
    slide.id = "day" + day.dayNum;

    const badgesHtml = day.badges.map(b => {
        const isStar = b.indexOf("★") !== -1;
        return '<span class="badge' + (isStar ? ' star' : '') + '">' + b + '</span>';
    }).join("");

    let bodyHtml;
    if (day.type === "flight") {
        bodyHtml = day.legs.map(renderFlightLeg).join("");
    } else {
        const mealsHtml = day.meals.map(m => mealIcon[m]).join(" &nbsp;·&nbsp; ");
        const hotelRow = day.hotel
            ? '<div class="info-row"><div class="label">酒店</div><div class="value">' + day.hotel + '</div></div>'
            : '';
        const transportRow = day.transport
            ? '<div class="info-row"><div class="label">交通</div><div class="value">' + day.transport + '</div></div>'
            : '';
        const noteRow = day.note
            ? '<div class="info-row note"><div class="label">备注</div><div class="value">' + day.note + '</div></div>'
            : '';
        bodyHtml =
            '<div class="desc">' + day.desc + '</div>' +
            '<div class="info-card">' +
                hotelRow +
                transportRow +
                '<div class="info-row"><div class="label">用餐</div><div class="value">' + mealsHtml + '</div></div>' +
                noteRow +
            '</div>';
    }

    slide.innerHTML =
        '<div class="slide-inner">' +
            '<div class="day-tag"><span class="num">D' + day.dayNum + '</span><span class="date">' + d.label + ' ' + d.weekday + '</span></div>' +
            '<div class="title">' + day.title + '</div>' +
            (badgesHtml ? '<div class="badges">' + badgesHtml + '</div>' : '') +
            bodyHtml +
        '</div>';

    slider.appendChild(slide);

    // dot
    const dot = document.createElement("div");
    dot.className = "dot";
    dotsEl.appendChild(dot);

    // daybar button
    const btn = document.createElement("button");
    btn.textContent = String(day.dayNum);
    btn.className = "";
    btn.addEventListener("click", () => {
        slide.scrollIntoView({ behavior: "smooth", inline: "start" });
    });
    daybarEl.appendChild(btn);
});

const dots = document.querySelectorAll(".dot");
const dayBtns = document.querySelectorAll(".daybar button");

function updateActive() {
    const page = Math.round(slider.scrollLeft / slider.clientWidth);
    dots.forEach((dot, index) => dot.classList.toggle("active", index === page));
    dayBtns.forEach((btn, index) => btn.classList.toggle("active", index === page));
    const activeBtn = dayBtns[page];
    if (activeBtn) activeBtn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
}

slider.addEventListener("scroll", updateActive);

document.getElementById("arrowLeft").addEventListener("click", () => {
    slider.scrollBy({ left: -slider.clientWidth, behavior: "smooth" });
});
document.getElementById("arrowRight").addEventListener("click", () => {
    slider.scrollBy({ left: slider.clientWidth, behavior: "smooth" });
});

document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") slider.scrollBy({ left: slider.clientWidth, behavior: "smooth" });
    if (e.key === "ArrowLeft") slider.scrollBy({ left: -slider.clientWidth, behavior: "smooth" });
});
</script>

</body>
</html>
