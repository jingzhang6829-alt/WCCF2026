<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>第24届华盛顿中国文化节节目单</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

.slider {
    width: 100%;
    height: 100%;
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
}

.slide {
    min-width: 100%;
    height: 100%;
    scroll-snap-align: start;

    display: flex;
    justify-content: center;
    align-items: center;
}

.slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* 隐藏滚动条 */
.slider::-webkit-scrollbar {
    display: none;
}

.slider {
    scrollbar-width: none;
}

/* 页码圆点 */
.dots {
    position: fixed;
    bottom: 15px;
    left: 0;
    right: 0;

    display: flex;
    justify-content: center;
    gap: 8px;

    z-index: 10;
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.45);
}

.dot.active {
    background: white;
}
</style>
</head>

<body>

<div class="slider" id="slider">

    <div class="slide">
        <img src="page1.png" alt="封面">
    </div>

    <div class="slide">
        <img src="page2.png" alt="上午场">
    </div>

    <div class="slide">
        <img src="page3.png" alt="下午场">
    </div>

</div>

<div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
</div>

<script>
const slider = document.getElementById("slider");
const dots = document.querySelectorAll(".dot");

slider.addEventListener("scroll", () => {

    const page =
        Math.round(slider.scrollLeft / slider.clientWidth);

    dots.forEach((dot, index) => {
        dot.classList.toggle("active", index === page);
    });

});
</script>

</body>
</html>
