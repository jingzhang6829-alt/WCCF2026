<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>第24届华盛顿中国文化节</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

.slider {
    width: 100%;
    height: 100%;
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
}

.slide {
    position: relative;
    min-width: 100%;
    height: 100%;
    scroll-snap-align: start;

    display: flex;
    justify-content: center;
    align-items: center;
}

.slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.slide iframe {
    display: block;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: #000;
}

/* 隐藏滚动条 */
.slider::-webkit-scrollbar {
    display: none;
}

.slider {
    scrollbar-width: none;
}

/* PROGRAM 字样下方按钮 */
.toolbar {
    position: fixed;
    top: 44%;
    left: 0;
    right: 0;

    display: flex;
    justify-content: center;
    gap: 10px;

    z-index: 10;
}

.toolbar a {
    padding: 7px 16px;
    border-radius: 18px;
    background: linear-gradient(180deg, #b5262a, #8f1c1f);
    color: #f4dfa3;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid #d4af5a;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
}

.toolbar a:active {
    background: linear-gradient(180deg, #8f1c1f, #6f1416);
}

/* 页码圆点 */
.dots {
    position: fixed;
    bottom: 15px;
    left: 0;
    right: 0;

    display: flex;
    justify-content: center;
    gap: 8px;

    z-index: 10;
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.45);
}

.dot.active {
    background: white;
}
</style>
</head>

<body>

<div class="toolbar" id="toolbar">
    <a href="index.html#Slide4">平面图</a>
    <a href="index.html#Slide2">节目单</a>
    <a href="index.html#Slide6">人员表</a>
    <a href="index.html#Slide5">帐篷分配</a>
</div>

<div class="slider" id="slider">

    <div class="slide" id="coverSlide">
        <img src="Page1.png" alt="封面" id="coverImg">
    </div>

    <div class="slide" id="Slide2">
        <img src="Page2.png" alt="上午场">
    </div>

    <div class="slide" id="Slide3">
        <img src="Page3.png" alt="下午场">
    </div>
    <div class="slide" id="Slide4">
        <img src="FloorPlan.jpg" alt="场地图">
    </div>
    <div class="slide" id="Slide5">
        <iframe src="TentList.html" title="帐篷分配"></iframe>
    </div>
    <div class="slide" id="Slide6">
        <iframe src="Staff.html" title="人员表"></iframe>
    </div>

</div>

<div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
</div>

<script>
const slider = document.getElementById("slider");
const dots = document.querySelectorAll(".dot");

slider.addEventListener("scroll", () => {

    const page =
        Math.round(slider.scrollLeft / slider.clientWidth);

    dots.forEach((dot, index) => {
        dot.classList.toggle("active", index === page);
    });

});

/* 按钮跟随封面图中 "PROGRAM" 字样下方位置 */
const coverSlide = document.getElementById("coverSlide");
const coverImg = document.getElementById("coverImg");
const toolbar = document.getElementById("toolbar");
const TARGET_IMG_Y = 508; // page1.png 原图中 "PROGRAM" 副标题下方的像素位置（图片尺寸 832x1248）

function positionToolbar() {
    if (!coverImg.naturalWidth) return;

    const cw = coverSlide.clientWidth;
    const ch = coverSlide.clientHeight;
    const scale = Math.min(cw / coverImg.naturalWidth, ch / coverImg.naturalHeight);
    const dispH = coverImg.naturalHeight * scale;
    const offsetY = (ch - dispH) / 2;

    toolbar.style.top = (offsetY + TARGET_IMG_Y * scale) + "px";
}

if (coverImg.complete) {
    positionToolbar();
} else {
    coverImg.addEventListener("load", positionToolbar);
}
window.addEventListener("resize", positionToolbar);
</script>

</body>
</html>
